server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # El frontend siempre llama a /api/... (ruta relativa; sin CORS ni VITE_API_URL — S4)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_read_timeout 120s;   # supera el límite de 90 s de QAOA
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
